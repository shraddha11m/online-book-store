<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | Online Book Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px 50px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 45px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
        }

        .welcome {
            color: #666;
            margin-bottom: 30px;
        }

        .payment-option {
            border: 1px solid #ddd;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .payment-option:hover {
            border-color: #3498db;
            background: #f8fbff;
        }

        .payment-option input {
            margin-right: 10px;
        }

        .payment-title {
            font-weight: bold;
        }

        .payment-description {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
            margin-left: 25px;
        }

        .button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #27ae60;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #219150;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
        }

    </style>

</head>

<body>

<header>

    <h1>📚 Online Book Store</h1>

</header>

<div class="container">

    <div class="card">

        <h2>💳 Checkout</h2>

        <p class="welcome">
            Welcome,
            <strong th:text="${username}">
                User
            </strong>
        </p>

        <form method="post"
              action="/orders/place">

            <div class="payment-option">

                <label>

                    <input type="radio"
                           name="paymentMethod"
                           value="UPI"
                           required>

                    <span class="payment-title">
                        📱 UPI
                    </span>

                </label>

                <div class="payment-description">
                    Dummy UPI payment for project demonstration.
                </div>

            </div>

            <div class="payment-option">

                <label>

                    <input type="radio"
                           name="paymentMethod"
                           value="CARD">

                    <span class="payment-title">
                        💳 Card
                    </span>

                </label>

                <div class="payment-description">
                    Dummy card payment for project demonstration.
                </div>

            </div>

            <div class="payment-option">

                <label>

                    <input type="radio"
                           name="paymentMethod"
                           value="COD">

                    <span class="payment-title">
                        📦 Cash on Delivery
                    </span>

                </label>

                <div class="payment-description">
                    Pay when your order is delivered.
                </div>

            </div>

            <button type="submit"
                    class="button">

                ✓ Confirm Order

            </button>

        </form>

        <a href="/cart"
           class="back">

            ← Back to Cart

        </a>

    </div>

</div>

</body>

</html>
